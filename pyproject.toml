[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "buhito"
version = "0.0.0"
authors = [
  {name = "Buhito Developers", email = "un_graphlets@lanl.gov"},
]
description = "Graphlet enumeration, feature extraction, and lossless MDL graph compression"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = {file = "LICENSE.txt"}
keywords = ["graphs", "graphlets", "motifs", "compression", "MDL"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "networkx>=3.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.urls]
Homepage = "https://github.com/lanl/buhito"
Repository = "https://github.com/lanl/buhito"
Issues = "https://github.com/lanl/buhito/issues"

[project.optional-dependencies]
tests = [
  "pytest>=8.3",
  "tqdm>=4.66",
]
chem = [
  "rdkit",
]
viz = [
  "graphviz",
  "matplotlib>=3.8",
]
gnn = [
  "torch>=2.2",
]
notebooks = [
  "jupyterlab>=4.0",
  "matplotlib>=3.8",
  "nbformat>=5.10",
  "tqdm>=4.66",
]
dev = [
  "build>=1.2",
  "jupyterlab>=4.0",
  "matplotlib>=3.8",
  "nbformat>=5.10",
  "pytest>=8.3",
  "ruff>=0.11",
  "tqdm>=4.66",
]
full = [
  "graphviz",
  "jupyterlab>=4.0",
  "matplotlib>=3.8",
  "nbformat>=5.10",
  "numba",
  "rdkit",
  "scipy",
  "tqdm>=4.66",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
